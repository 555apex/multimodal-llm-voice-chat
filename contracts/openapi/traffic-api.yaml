openapi: 3.1.0
info:
  title: 福建应急交通Agent API
  version: 0.11.0
  description: 对话式道路交通查询、设施健康预警、福建九市库存资源调度、三级上报与通告、Docker语音服务接口
servers:
  - url: http://localhost:8080
paths:
  /api/v1/conversations/{conversationId}/messages/stream:
    post:
      summary: 发送自然语言消息并接收Agent流式事件
      operationId: converseWithAgent
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageRequest'
            example:
              message: 福建省哪些国省道路段处于拥堵异常状态
      responses:
        '200':
          description: |
            SSE事件流。事件名称可能为run.started、stage.changed、intent.recognized、
            skill.selected、tool.started、tool.progress、tool.completed、answer.delta、answer.speech、
            result.traffic、run.completed或run.failed。
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                event: answer.delta
                data: {"content":"当前福建国省干线异常路段已按拥堵程度排序。未来1至2小时，预计重点路段可能持续拥堵。"}
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/speech/capabilities:
    get:
      summary: 查询ASR、TTS当前可用性及上传限制
      description: 语音容器离线时仍返回200，但asrAvailable和ttsAvailable为false。
      operationId: getSpeechCapabilities
      responses:
        '200':
          description: 当前语音能力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechCapabilitiesApiResponse'

  /api/v1/speech/transcriptions:
    post:
      summary: 识别一段浏览器录音
      operationId: transcribeSpeech
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, durationMs]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 最大10 MB，支持WebM、MP4、Ogg或WAV音频
                durationMs:
                  type: integer
                  minimum: 1
                  maximum: 60000
      responses:
        '200':
          description: 识别文本，不会自动发送为聊天消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechTranscriptionApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: ASR容器不可用或识别失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/speech/syntheses:
    post:
      summary: 将一个自然语言片段合成为MP3
      operationId: synthesizeSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechSynthesisRequest'
      responses:
        '200':
          description: Edge-TTS合成的音频；响应禁止缓存
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: TTS容器或Microsoft在线语音服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/speech/syntheses/stream:
    post:
      summary: 本地语音的连续 PCM 音频流
      operationId: streamSpeechSynthesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechSynthesisRequest'
      responses:
        '200':
          description: |
            SSE 依次发送 audio.start（sampleRate=24000、channels=1、format=s16le）、
            audio.chunk（从零递增的 sequence、Base64 pcm）、audio.completed（chunks 总数）。
            失败发送 audio.failed（message）；缺少完成事件的断流不可视为成功。
            响应关闭缓存与代理缓冲。
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/emergency-events/pending/next:
    get:
      summary: 查询最早发生的未处理异常事件
      operationId: getNextPendingEmergency
      responses:
        '200':
          description: 返回下一条事件、最新工单版本和待处理总数；无事件时data为null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAlertApiResponse'

  /api/v1/emergency-events/{eventId}/dispatches:
    post:
      summary: 为数据库异常事件生成或重试调度工单
      operationId: generateEmergencyDispatch
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 当前最新工单版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 事件或工单状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 模型服务失败，失败状态已持久化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/emergency-events/{eventId}/no-dispatch:
    post:
      summary: 人工确认事件无需生成调度工单
      operationId: markEmergencyNoDispatch
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoDispatchRequest'
      responses:
        '200':
          description: 事件已标记为无需调度
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 事件已有工单或状态已变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/emergency-events/{eventId}/classification-retries:
    post:
      summary: 立即重试一条分类失败的应急事件
      operationId: retryEmergencyEventClassification
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200': { description: 重试完成 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/emergency-events/classification-retries/next:
    post:
      summary: 忽略自动退避时间并立即重试最早的一条待分类事件
      operationId: retryNextEmergencyEventClassification
      responses:
        '200':
          description: 是否处理了一条待分类事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BooleanApiResponse' }

  /api/v1/dispatches/{planId}:
    get:
      summary: 查询调度方案当前状态
      operationId: getDispatchPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 调度方案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/dispatches/{planId}/approvals:
    post:
      summary: 兼容旧版的一级上报或返工接口
      description: APPROVE仅代表一级确认并上报二级，不会办结事件；REJECT填写意见后生成新版本。
      operationId: approveDispatchPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchApprovalRequest'
            example:
              decision: APPROVE
              comment: 同意执行
              expectedVersion: 1
              idempotencyKey: browser-generated-uuid
      responses:
        '200':
          description: 上报后方案仍为WAITING_APPROVAL；返工后返回新生成的WAITING_APPROVAL版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 方案版本冲突或当前状态不允许审批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/emergency-workflows/inbox:
    get:
      summary: 查询指定层级最早待办及三级数量
      operationId: getEmergencyWorkflowInbox
      parameters:
        - in: query
          name: stage
          required: true
          schema:
            $ref: '#/components/schemas/WorkflowStage'
      responses:
        '200':
          description: 待办为空时item为null，counts仍返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInboxApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/emergency-workflows/{workflowId}/level-1-decisions:
    post:
      summary: 一级现场席位上报或驳回AI返工
      operationId: decideEmergencyWorkflowLevel1
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Level1DecisionRequest'
      responses:
        '200':
          description: 更新后的完整工作流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyWorkflowApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency-workflows/{workflowId}/professional-reviews:
    post:
      summary: 二级市交通应急办专业复核
      operationId: reviewEmergencyWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionalReviewRequest'
      responses:
        '200':
          description: 更新后的完整工作流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyWorkflowApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency-workflows/{workflowId}/event-type-corrections:
    post:
      summary: 一级人工更正事件类型并生成新版方案
      description: 仅限一级待上报阶段；旧版资源会释放，分类、工单和动作流水保留完整记录。
      operationId: correctEmergencyEventType
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventTypeCorrectionRequest' }
      responses:
        '200':
          description: 已生成新版方案的完整工作流
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyWorkflowApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/emergency-workflows/{workflowId}/command-decisions:
    post:
      summary: 三级省级决策退回或批准并形成通告
      operationId: decideEmergencyWorkflowCommand
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandDecisionRequest'
      responses:
        '200':
          description: 批准时包含不可修改的noticeSnapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyWorkflowApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency-workflows/{workflowId}/resource-releases:
    post:
      summary: 已通告工作流整单归还已调度资源
      description: 最终通告快照保持不变；库存由已调度恢复为可用，原因和幂等键写入动作流水。
      operationId: releaseEmergencyWorkflowResources
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceReleaseRequest'
      responses:
        '200':
          description: 归还后的完整工作流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyWorkflowApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emergency-workflows/history:
    get:
      summary: 分页查询已通告和无需调度记录
      operationId: getEmergencyWorkflowHistory
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 办结工作流和完整时间线
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowHistoryApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/emergency-workflows/{workflowId}:
    get:
      summary: 查询单个工作流及完整时间线
      operationId: getEmergencyWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: 完整工作流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyWorkflowApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/facility-alerts:
    get:
      summary: 分页查询设施异常预警清单
      description: 只读w_realtime_abnormal中由上游阈值逻辑产生的异常快照。
      operationId: queryFacilityAlerts
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/FacilityAlertStatus' }
        - in: query
          name: alarmLevel
          schema: { $ref: '#/components/schemas/FacilityAlarmLevel' }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 预警分页、各状态数量与活动告警等级数量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityAlertPageApiResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/facility-alerts/health-report:
    get:
      summary: 生成基础设施健康状态报告
      description: 基于待确认和处理中记录由Java确定性汇总，不调用大模型。
      operationId: getFacilityHealthReport
      responses:
        '200':
          description: 整体健康状态、等级数量和逐设施状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityHealthReportApiResponse' }

  /api/v1/facility-alerts/focus:
    get:
      summary: 查询重点关注基础设施
      operationId: getFacilityFocus
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: 按最高风险、活动告警数和最早触发时间排序
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityFocusApiResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/facility-alerts/{alertId}/status-transitions:
    post:
      summary: 确认或结束一条设施预警
      description: |
        仅允许PENDING→CONFIRMED→CLOSED。结束时resolutionType必须为
        RESOLVED或IGNORED；服务端使用expectedStatus条件更新，并用最新处理备注覆盖remark。
      operationId: transitionFacilityAlert
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacilityAlertTransitionRequest' }
      responses:
        '200':
          description: 更新后的预警快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityAlertApiResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/traffic/queries:
    post:
      summary: 使用结构化参数查询MySQL交通业务数据
      description: 支持路线目录、国省干线路况与通行能力、跨区域城市对/路线联系、福州或厦门车型出行特征，以及城市目的地联系倾向与矩阵。模型轻微格式偏差会修复或按结构化事实安全规范化；模型服务不可用时按具体业务的失败或确定性降级规则处理。
      operationId: queryHighwayTraffic
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficQueryRequest'
            example:
              queryType: CITY_PAIR
              originCity: 宁德市
              destinationCity: 福州市
      responses:
        '200':
          description: 查询及模型总结完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficQueryApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: MySQL快照尚未发布、数据库不可用或模型服务/结构连续失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    TraceId:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string
      description: 调用方可传入的链路标识；不传时由后端生成
    PlanId:
      in: path
      name: planId
      required: true
      schema:
        type: string
    WorkflowId:
      in: path
      name: workflowId
      required: true
      schema:
        type: string
    EventId:
      in: path
      name: eventId
      required: true
      description: w_lw_incident.c_no，按URL路径编码后传输
      schema:
        type: string
        minLength: 1
        maxLength: 64

  responses:
    BadRequest:
      description: 请求参数或业务输入不正确
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 事件、调度方案或工作流不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 工作流版本、幂等键或当前阶段冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AgentMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000

    SpeechCapabilities:
      type: object
      required: [asrAvailable, ttsAvailable, maxRecordingSeconds, maxAudioBytes]
      properties:
        asrAvailable: { type: boolean }
        ttsAvailable: { type: boolean }
        asrModel: { type: [string, 'null'], examples: [small] }
        ttsVoice: { type: [string, 'null'], examples: [zh-CN-XiaoxiaoNeural] }
        maxRecordingSeconds: { type: integer, minimum: 1, examples: [60] }
        maxAudioBytes: { type: integer, minimum: 1, examples: [10485760] }

    SpeechTranscription:
      type: object
      required: [text, language, durationMs]
      properties:
        text: { type: string }
        language: { type: string, examples: [zh] }
        durationMs: { type: integer, minimum: 0 }

    SpeechSynthesisRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    TrafficQueryRequest:
      type: object
      required: [queryType]
      properties:
        queryType:
          type: string
          enum: [PROVINCE_OVERVIEW, ROUTE_CATALOG, PROVINCE_ABNORMAL, CITY_PAIR, ROUTE_DETAIL, CAPACITY_OVERVIEW, CAPACITY_BOTTLENECKS, CAPACITY_ROUTE_DETAIL, REGIONAL_TRAFFIC_OVERVIEW, REGIONAL_PAIR_PRESSURE, REGIONAL_KEY_CHANNELS, VEHICLE_PATTERN_OVERVIEW, VEHICLE_STRUCTURE, VEHICLE_HOURLY_PATTERN, VEHICLE_DAY_TYPE_COMPARISON, OD_DESTINATION_TENDENCY, OD_CONNECTION_MATRIX]
        originCity:
          type: [string, 'null']
          maxLength: 20
        destinationCity:
          type: [string, 'null']
          maxLength: 20
        routeCode:
          type: [string, 'null']
          maxLength: 20
        routeName:
          type: [string, 'null']
          maxLength: 100
        selectedCities:
          type: array
          maxItems: 9
          items: { type: string, maxLength: 20 }
          description: REGIONAL_*要求3至9个福建地级市，按路网起终点筛选跨市路线；为空默认九市。OD_DESTINATION_TENDENCY要求且仅允许1市；OD_CONNECTION_MATRIX要求2至9市，为空时默认福建九市。车型特征支持福州或厦门单城市
        analysisCity:
          type: [string, 'null']
          maxLength: 20
          description: 车型出行特征查询城市，本期为福州市或厦门市
        includeTrend:
          type: [boolean, 'null']
          description: 是否在普通路况摘要中附加未来1至2小时定性趋势；容量、压力和车型查询忽略此字段

    TrafficStatus:
      type: integer
      description: 数据库原生五级状态：10畅通、20轻度拥堵、30中度拥堵、40重度拥堵、50堵塞
      enum: [10, 20, 30, 40, 50]

    RouteTrafficSummary:
      type: object
      required: [routeCode, routeName, averageSpeedKmh, status, statusName]
      properties:
        routeCode: { type: string }
        routeName: { type: string }
        averageSpeedKmh: { type: number, minimum: 0 }
        status: { $ref: '#/components/schemas/TrafficStatus' }
        statusName: { type: string }

    TrafficSegment:
      type: object
      required: [routeCode, routeName, routeSection, distanceKm, averageSpeedKmh, status, statusName, severity]
      properties:
        routeCode: { type: string }
        routeName: { type: string }
        routeSection: { type: string }
        distanceKm:
          type: [number, 'null']
          minimum: 0
        averageSpeedKmh: { type: number, minimum: 0 }
        status: { $ref: '#/components/schemas/TrafficStatus' }
        statusName: { type: string }
        severity: { type: number, minimum: 0, maximum: 1 }

    CapacityLevel:
      type: string
      description: 项目三级评估口径：利用率不低于0.80正常，大于0.30且低于0.80瓶颈，不高于0.30严重瓶颈
      enum: [NORMAL, BOTTLENECK, SEVERE_BOTTLENECK]

    RoadCapacityRow:
      type: object
      required: [routeCode, routeName, actualCapacityVph, designCapacityVph, utilizationRatio, capacityLevel, capacityLevelName]
      properties:
        routeCode: { type: string }
        routeName: { type: string }
        actualCapacityVph:
          type: number
          minimum: 0
          description: 直接取w_road_capacity.avg_previous_hour，单位辆/小时
        designCapacityVph:
          type: number
          minimum: 0
          description: 直接取w_road_capacity.design_flow，单位辆/小时
        utilizationRatio:
          type: number
          minimum: 0
          maximum: 1
          description: 直接取w_road_capacity.utilization_perc
        capacityLevel: { $ref: '#/components/schemas/CapacityLevel' }
        capacityLevelName: { type: string, enum: [正常, 瓶颈, 严重瓶颈] }

    SelectedRegion:
      type: object
      required: [regionCode, regionName]
      properties:
        regionCode: { type: string }
        regionName: { type: string }

    RegionalPairRow:
      type: object
      required: [cityARegionCode, cityAName, cityBRegionCode, cityBName, routeCount, checkpointCount, weeklyTotalFlow, dailyAverageFlow, averageSpeedKmh]
      properties:
        cityARegionCode: { type: string }
        cityAName: { type: string }
        cityBRegionCode: { type: string }
        cityBName: { type: string }
        routeCount: { type: integer, minimum: 1 }
        checkpointCount: { type: integer, minimum: 1 }
        weeklyTotalFlow: { type: integer, format: int64, minimum: 0 }
        dailyAverageFlow: { type: integer, format: int64, minimum: 0 }
        averageSpeedKmh: { type: number, minimum: 0 }

    RegionalChannelRow:
      type: object
      required: [cityARegionCode, cityAName, cityBRegionCode, cityBName, routeCode, routeName, checkpointCount, weeklyTotalFlow, dailyAverageFlow, averageSpeedKmh]
      properties:
        cityARegionCode: { type: string }
        cityAName: { type: string }
        cityBRegionCode: { type: string }
        cityBName: { type: string }
        routeCode: { type: string }
        routeName: { type: string }
        checkpointCount: { type: integer, minimum: 1 }
        weeklyTotalFlow: { type: integer, format: int64, minimum: 0 }
        dailyAverageFlow: { type: integer, format: int64, minimum: 0 }
        averageSpeedKmh: { type: number, minimum: 0 }

    VehicleStructureRow:
      type: object
      required: [vehicleType, vehicleTypeName, weeklyVolume, shareRatio]
      properties:
        vehicleType: { type: string, enum: [CAR, BUS, TRUCK] }
        vehicleTypeName: { type: string, enum: [小型客车, 中型客车, 大型货车] }
        weeklyVolume: { type: integer, minimum: 0 }
        shareRatio: { type: number, minimum: 0, maximum: 1 }

    VehicleTimeFeatureRow:
      type: object
      required: [vehicleType, vehicleTypeName, peakHour, peakVolume, morningPeakRatio, eveningPeakRatio, characteristic]
      properties:
        vehicleType: { type: string, enum: [CAR, BUS, TRUCK] }
        vehicleTypeName: { type: string }
        peakHour: { type: string }
        peakVolume: { type: integer, minimum: 0 }
        morningPeakRatio: { type: number, minimum: 0, maximum: 1 }
        eveningPeakRatio: { type: number, minimum: 0, maximum: 1 }
        characteristic: { type: string }

    VehicleDayTypeRow:
      type: object
      required: [vehicleType, vehicleTypeName, weekdayVolume, weekendVolume]
      properties:
        vehicleType: { type: string, enum: [CAR, BUS, TRUCK] }
        vehicleTypeName: { type: string }
        weekdayVolume: { type: integer, minimum: 0, description: 工作日5天合计 }
        weekendVolume: { type: integer, minimum: 0, description: 周末2天合计 }

    HourlyVehicleFlow:
      type: object
      required: [hour, car, bus, truck]
      properties:
        hour: { type: string, pattern: '^([01][0-9]|2[0-3]):00$' }
        car: { type: integer, minimum: 0 }
        bus: { type: integer, minimum: 0 }
        truck: { type: integer, minimum: 0 }

    OdDestinationTendencyRow:
      type: object
      required: [analysisRegionCode, analysisCityName, destinationRegionCode, destinationCityName, routeCount, weeklyConnectionStrength, tendencyRatio]
      properties:
        analysisRegionCode: { type: string }
        analysisCityName: { type: string }
        destinationRegionCode: { type: string }
        destinationCityName: { type: string }
        routeCount: { type: integer, minimum: 1, description: 连接城市对的跨市路线数 }
        weeklyConnectionStrength: { type: number, minimum: 0, description: 各路线卡口7日流量均值之和 }
        tendencyRatio: { type: number, minimum: 0, maximum: 1, description: 该城市对联系强度占分析城市全省跨市联系强度的比例 }

    OdMatrixCell:
      type: object
      required: [destinationRegionCode, destinationCityName, weeklyConnectionStrength, tendencyRatio]
      properties:
        destinationRegionCode: { type: string }
        destinationCityName: { type: string }
        weeklyConnectionStrength: { type: [number, 'null'], minimum: 0 }
        tendencyRatio: { type: [number, 'null'], minimum: 0, maximum: 1 }

    OdMatrixRow:
      type: object
      required: [analysisRegionCode, analysisCityName, cells]
      properties:
        analysisRegionCode: { type: string }
        analysisCityName: { type: string }
        cells:
          type: array
          items: { $ref: '#/components/schemas/OdMatrixCell' }

    TrafficQueryResult:
      type: object
      required: [queryType, title, summary, routeSummaries, segments, capacityRows, selectedRegions, regionalPairRows, regionalChannelRows, totalRegionalPairCount, totalRegionalChannelCount, vehicleStructureRows, vehicleTimeFeatureRows, vehicleDayTypeRows, hourlyVehicleSeries, odDestinationRows, odMatrixRows, totalSegmentCount, displayedSegmentCount, truncated, source, acquiredAt, warnings, traceId]
      properties:
        queryType:
          type: string
          enum: [PROVINCE_OVERVIEW, ROUTE_CATALOG, PROVINCE_ABNORMAL, CITY_PAIR, ROUTE_DETAIL, CAPACITY_OVERVIEW, CAPACITY_BOTTLENECKS, CAPACITY_ROUTE_DETAIL, REGIONAL_TRAFFIC_OVERVIEW, REGIONAL_PAIR_PRESSURE, REGIONAL_KEY_CHANNELS, VEHICLE_PATTERN_OVERVIEW, VEHICLE_STRUCTURE, VEHICLE_HOURLY_PATTERN, VEHICLE_DAY_TYPE_COMPARISON, OD_DESTINATION_TENDENCY, OD_CONNECTION_MATRIX]
        title: { type: string }
        summary:
          type: string
          description: 普通路况默认只返回当前态势摘要；includeTrend=true时再附加未来1至2小时定性趋势。容量查询通常为3至5句研判。趋势是基于当前事实的启发式研判，不是精确预测模型
        routeSummaries:
          type: array
          items: { $ref: '#/components/schemas/RouteTrafficSummary' }
        segments:
          type: array
          items: { $ref: '#/components/schemas/TrafficSegment' }
        capacityRows:
          type: array
          items: { $ref: '#/components/schemas/RoadCapacityRow' }
        selectedRegions:
          type: array
          items: { $ref: '#/components/schemas/SelectedRegion' }
        regionalPairRows:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/RegionalPairRow' }
        regionalChannelRows:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/RegionalChannelRow' }
        totalRegionalPairCount: { type: integer, minimum: 0 }
        totalRegionalChannelCount: { type: integer, minimum: 0 }
        analysisCity: { type: [string, 'null'] }
        vehicleStructureRows:
          type: array
          items: { $ref: '#/components/schemas/VehicleStructureRow' }
        vehicleTimeFeatureRows:
          type: array
          items: { $ref: '#/components/schemas/VehicleTimeFeatureRow' }
        vehicleDayTypeRows:
          type: array
          items: { $ref: '#/components/schemas/VehicleDayTypeRow' }
        hourlyVehicleSeries:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/HourlyVehicleFlow' }
        odDestinationRows:
          type: array
          description: 单城市目的地联系倾向，按倾向比例降序
          items: { $ref: '#/components/schemas/OdDestinationTendencyRow' }
        odMatrixRows:
          type: array
          description: 两市、多市或全省目的地联系倾向矩阵；无直接跨市路线的单元格返回null
          items: { $ref: '#/components/schemas/OdMatrixRow' }
        totalSegmentCount:
          type: integer
          minimum: 0
          description: 路况查询表示路段总数；容量查询表示符合当前范围的路线总数
        displayedSegmentCount:
          type: integer
          minimum: 0
          description: 路况查询表示展示路段数；容量查询表示展示路线数
        truncated: { type: boolean }
        source: { type: string, const: MYSQL }
        acquiredAt: { type: string, format: date-time }
        warnings:
          type: array
          items: { type: string }
        traceId: { type: string }

    DispatchApprovalRequest:
      type: object
      required: [decision, expectedVersion, idempotencyKey]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: [string, 'null']
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 1
        idempotencyKey:
          type: string
          minLength: 1

    WorkflowStage:
      type: string
      enum: [LEVEL_1, LEVEL_2, LEVEL_3]

    WorkflowStatus:
      type: string
      enum:
        - WAITING_GENERATION
        - GENERATING
        - WAITING_LEVEL_1_SUBMISSION
        - WAITING_LEVEL_2_REVIEW
        - WAITING_LEVEL_3_DECISION
        - REVISING
        - GENERATION_FAILED
        - PUBLISHED
        - NO_DISPATCH

    Level1DecisionRequest:
      type: object
      required: [decision, expectedWorkflowVersion, idempotencyKey]
      properties:
        decision:
          type: string
          enum: [SUBMIT, REJECT]
        comment:
          type: [string, 'null']
          maxLength: 500
          description: REJECT时必填
        expectedWorkflowVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }

    ProfessionalReviewRequest:
      type: object
      required: [decision, expectedWorkflowVersion, idempotencyKey]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        eventSeverity:
          type: [string, 'null']
          enum: [GENERAL, LARGER, MAJOR, ESPECIALLY_MAJOR, null]
          description: APPROVE时必填
        resourceFeasibility:
          type: [string, 'null']
          enum: [FEASIBLE, FEASIBLE_WITH_GAP, NEEDS_ADJUSTMENT, null]
          description: 无缺口时通过必须为FEASIBLE；有缺口时必须为FEASIBLE_WITH_GAP
        impactAssessment:
          type: [string, 'null']
          maxLength: 1000
          description: APPROVE时必填
        coordinationRequirements:
          type: [string, 'null']
          maxLength: 1000
          description: 有资源缺口但仍通过时必填
        comment:
          type: [string, 'null']
          maxLength: 500
          description: 通过时为专业意见，退回时为退回意见，均必填
        expectedWorkflowVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }

    CommandDecisionRequest:
      type: object
      required: [decision, expectedWorkflowVersion, idempotencyKey]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: [string, 'null']
          maxLength: 500
          description: 退回时必填；带资源缺口方案批准时也必填
        expectedWorkflowVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }

    ResourceReleaseRequest:
      type: object
      required: [reason, expectedWorkflowVersion, idempotencyKey]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedWorkflowVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }

    EventTypeCorrectionRequest:
      type: object
      required: [eventType, reason, expectedWorkflowVersion, idempotencyKey]
      properties:
        eventType:
          type: string
          enum: [DT01, DT02, DT03, DT04, DT05, ET101, ET102, ET103, ET104, ET105, ET106, ET107, ET108, ET109, ET110, ET112]
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedWorkflowVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }

    EmergencyEvent:
      type: object
      required: [eventId, customId, eventType, description]
      properties:
        eventId:
          type: string
          description: w_lw_incident.c_no，不使用贴源表自增id
        customId: { type: string }
        occurrenceTime:
          type: [string, 'null']
          format: date-time
        eventType: { type: string }
        eventTypeName:
          type: [string, 'null']
          description: 工作流事件视图中的中文类型名
        description: { type: string }
        cityCode:
          type: [string, 'null']
          description: 福建地级市行政区划编码，正式生成工单时不能为空
        cityName:
          type: [string, 'null']
          description: 事件归属的市级调度范围
        sourceName: { type: [string, 'null'], description: 事件来源 }
        sourceOrgName: { type: [string, 'null'], description: 来源所属单位 }
        place: { type: [string, 'null'], description: 甲方记录的发生地点 }
        routeNo: { type: [string, 'null'] }
        routeName: { type: [string, 'null'] }

    SuggestedResource:
      type: object
      required: [resourceType, resourceName, quantity, unit, purpose]
      properties:
        resourceType: { type: string }
        resourceName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        purpose: { type: string }

    ResourceRequirement:
      type: object
      required: [resourceTypeCode, resourceTypeName, quantity, unit, purpose]
      properties:
        resourceTypeCode: { type: string }
        resourceTypeName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        purpose: { type: string }

    AllocatedResource:
      type: object
      required: [resourceId, resourceTypeCode, resourceTypeName, resourceName, sourceCityCode, sourceCityName, quantity, unit, purpose, estimatedDistanceKm, dispatchScope]
      properties:
        resourceId: { type: string }
        resourceTypeCode: { type: string }
        resourceTypeName: { type: string }
        resourceName: { type: string }
        sourceCityCode: { type: string }
        sourceCityName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        purpose: { type: string }
        estimatedDistanceKm:
          type: number
          minimum: 0
          description: 城市中心直线估算距离，仅用于排序
        dispatchScope: { type: string, enum: [LOCAL, CROSS_CITY] }

    ResourceShortage:
      type: object
      required: [resourceTypeCode, resourceTypeName, requiredQuantity, allocatedQuantity, shortageQuantity, unit, reason]
      properties:
        resourceTypeCode: { type: string }
        resourceTypeName: { type: string }
        requiredQuantity: { type: integer, minimum: 1 }
        allocatedQuantity: { type: integer, minimum: 0 }
        shortageQuantity: { type: integer, minimum: 1 }
        unit: { type: string }
        reason: { type: string }

    NoDispatchRequest:
      type: object
      required: [reason, confirmed]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        confirmed:
          type: boolean
          const: true

    DispatchPlan:
      type: object
      required: [planId, event, suggestedResources, resourceRequirements, allocatedResources, resourceShortages, rescuePlan, status, version, createdAt, updatedAt, approvalRequired]
      properties:
        planId: { type: string }
        event: { $ref: '#/components/schemas/EmergencyEvent' }
        suggestedResources:
          type: array
          items: { $ref: '#/components/schemas/SuggestedResource' }
          description: 兼容投影，内容来自实际分配资源
        resourceRequirements:
          type: array
          items: { $ref: '#/components/schemas/ResourceRequirement' }
        allocatedResources:
          type: array
          items: { $ref: '#/components/schemas/AllocatedResource' }
        resourceShortages:
          type: array
          items: { $ref: '#/components/schemas/ResourceShortage' }
        rescuePlan:
          type: [string, 'null']
        status:
          type: string
          enum: [GENERATING, WAITING_APPROVAL, REJECTED, APPROVED, FAILED]
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rejectionReason: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        responsePlanId: { type: [string, 'null'], description: 生成工单所使用的已发布预案ID }
        responsePlanVersion: { type: [integer, 'null'], minimum: 1 }
        responsePlanName: { type: [string, 'null'] }
        approvalRequired: { type: boolean }

    ResponsePlanResourceBaseline:
      type: object
      required: [resourceTypeCode, quantity, purpose, mode]
      properties:
        resourceTypeCode: { type: string }
        quantity: { type: integer, minimum: 1 }
        purpose: { type: string }
        mode: { type: string, enum: [BASE, CONDITIONAL] }

    EmergencyResponsePlanSnapshot:
      type: object
      required: [planId, eventType, eventTypeName, version, requiredFacts, rescuePlanTemplate, resourceBaseline, contentHash]
      properties:
        planId: { type: string }
        eventType: { type: string }
        eventTypeName: { type: string }
        version: { type: integer, minimum: 1 }
        requiredFacts:
          type: array
          items: { type: string }
        rescuePlanTemplate: { type: string }
        resourceBaseline:
          type: array
          items: { $ref: '#/components/schemas/ResponsePlanResourceBaseline' }
        contentHash: { type: string, minLength: 64, maxLength: 64 }

    EmergencyAlert:
      type: object
      required: [event, pendingCount]
      properties:
        event: { $ref: '#/components/schemas/EmergencyEvent' }
        dispatch:
          oneOf:
            - $ref: '#/components/schemas/DispatchPlan'
            - type: 'null'
        pendingCount: { type: integer, minimum: 1 }

    ProfessionalReview:
      type: object
      required: [reviewId, workflowId, planId, planVersion, status, createdAt, updatedAt]
      properties:
        reviewId: { type: string }
        workflowId: { type: string }
        planId: { type: string }
        planVersion: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [PENDING, PASSED, RETURNED]
        eventSeverity:
          type: [string, 'null']
          enum: [GENERAL, LARGER, MAJOR, ESPECIALLY_MAJOR, null]
        resourceFeasibility:
          type: [string, 'null']
          enum: [FEASIBLE, FEASIBLE_WITH_GAP, NEEDS_ADJUSTMENT, null]
        impactAssessment: { type: [string, 'null'] }
        coordinationRequirements: { type: [string, 'null'] }
        reviewOpinion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoticeSnapshot:
      type: object
      required: [noticeNumber, title, event, planId, planVersion, suggestedResources, resourceRequirements, allocatedResources, resourceShortages, rescuePlan, eventSeverity, impactAssessment, professionalOpinion, publishedAt]
      properties:
        noticeNumber: { type: string }
        title: { type: string }
        event: { $ref: '#/components/schemas/EmergencyEvent' }
        planId: { type: string }
        planVersion: { type: integer, minimum: 1 }
        suggestedResources:
          type: array
          items: { $ref: '#/components/schemas/SuggestedResource' }
        resourceRequirements:
          type: array
          items: { $ref: '#/components/schemas/ResourceRequirement' }
        allocatedResources:
          type: array
          items: { $ref: '#/components/schemas/AllocatedResource' }
        resourceShortages:
          type: array
          items: { $ref: '#/components/schemas/ResourceShortage' }
        rescuePlan: { type: string }
        eventSeverity:
          type: string
          enum: [GENERAL, LARGER, MAJOR, ESPECIALLY_MAJOR]
        impactAssessment: { type: string }
        coordinationRequirements: { type: [string, 'null'] }
        professionalOpinion: { type: string }
        commandOpinion: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        responsePlan:
          oneOf:
            - $ref: '#/components/schemas/EmergencyResponsePlanSnapshot'
            - type: 'null'

    CommandDecision:
      type: object
      required: [decisionId, workflowId, reviewId, planId, planVersion, status, createdAt, updatedAt]
      properties:
        decisionId: { type: string }
        workflowId: { type: string }
        reviewId: { type: string }
        planId: { type: string }
        planVersion: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [PENDING, RETURNED, PUBLISHED]
        decisionOpinion: { type: [string, 'null'] }
        noticeSnapshot:
          oneOf:
            - $ref: '#/components/schemas/NoticeSnapshot'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkflowAction:
      type: object
      required: [actionId, workflowId, actionType, toStatus, planVersion, idempotencyKey, createdAt]
      properties:
        actionId: { type: string }
        workflowId: { type: string }
        actionType:
          type: string
          enum: [GENERATION_STARTED, GENERATION_COMPLETED, GENERATION_FAILED, GENERATION_RETRIED, EVENT_TYPE_CORRECTED, LEVEL_1_SUBMITTED, LEVEL_1_RETURNED, LEVEL_2_PASSED, LEVEL_2_RETURNED, LEVEL_3_RETURNED, LEVEL_3_PUBLISHED, RESOURCES_RELEASED, NO_DISPATCH]
        fromStage:
          oneOf:
            - $ref: '#/components/schemas/WorkflowStage'
            - type: 'null'
        toStage:
          oneOf:
            - $ref: '#/components/schemas/WorkflowStage'
            - type: 'null'
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/WorkflowStatus'
            - type: 'null'
        toStatus: { $ref: '#/components/schemas/WorkflowStatus' }
        planId: { type: [string, 'null'] }
        planVersion: { type: integer, minimum: 0 }
        comment: { type: [string, 'null'] }
        detailJson: { type: [string, 'null'] }
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }

    EmergencyWorkflow:
      type: object
      required: [workflowStatus, workflowVersion, event, timeline, resourcesReleased]
      properties:
        workflowId: { type: [string, 'null'] }
        currentStage:
          oneOf:
            - $ref: '#/components/schemas/WorkflowStage'
            - type: 'null'
        workflowStatus: { $ref: '#/components/schemas/WorkflowStatus' }
        workflowVersion: { type: integer, minimum: 0 }
        terminalReason: { type: [string, 'null'], description: 无需调度等终止决定原因 }
        event: { $ref: '#/components/schemas/EmergencyEvent' }
        currentPlan:
          oneOf:
            - $ref: '#/components/schemas/DispatchPlan'
            - type: 'null'
        professionalReview:
          oneOf:
            - $ref: '#/components/schemas/ProfessionalReview'
            - type: 'null'
        commandDecision:
          oneOf:
            - $ref: '#/components/schemas/CommandDecision'
            - type: 'null'
        timeline:
          type: array
          items: { $ref: '#/components/schemas/WorkflowAction' }
        resourcesReleased:
          type: boolean
          description: 当前最终方案的实际调度资源是否已整单归还

    WorkflowCounts:
      type: object
      required: [level1, level2, level3, pendingClassification, classificationFailed]
      properties:
        level1: { type: integer, minimum: 0 }
        level2: { type: integer, minimum: 0 }
        level3: { type: integer, minimum: 0 }
        pendingClassification: { type: integer, minimum: 0 }
        classificationFailed: { type: integer, minimum: 0 }

    WorkflowInbox:
      type: object
      required: [counts]
      properties:
        item:
          oneOf:
            - $ref: '#/components/schemas/EmergencyWorkflow'
            - type: 'null'
        counts: { $ref: '#/components/schemas/WorkflowCounts' }

    WorkflowHistory:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EmergencyWorkflow' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    FacilityAlertStatus:
      type: string
      enum: [PENDING, CONFIRMED, CLOSED]
      description: 待确认、处理中、已结束（已消除或已忽略）

    FacilityAlarmLevel:
      type: string
      enum: [WARNING, SEVERE, EMERGENCY]

    FacilityHealthState:
      type: string
      enum: [NO_ACTIVE_ALERT, ATTENTION, ABNORMAL, DANGER]

    FacilityAlert:
      type: object
      required: [alertId, facilityName, metricName, alarmLevel, alarmLevelName, collectTime, triggerTime, status, statusName, thresholdAssessment, sourceConsistent]
      properties:
        alertId: { type: string, pattern: '^[0-9]+$', example: '2097166786449965057' }
        facilityName: { type: string }
        metricName: { type: string }
        actualValue: { type: [number, 'null'] }
        actualStringValue: { type: [string, 'null'] }
        thresholdMin: { type: [number, 'null'] }
        thresholdMax: { type: [number, 'null'] }
        alarmLevel: { $ref: '#/components/schemas/FacilityAlarmLevel' }
        alarmLevelName: { type: string }
        collectTime: { type: string, format: date-time }
        triggerTime: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/FacilityAlertStatus' }
        statusName: { type: string }
        remark: { type: [string, 'null'] }
        thresholdAssessment: { type: string }
        sourceConsistent:
          type: boolean
          description: 实际数值与表内阈值快照是否一致；false时页面提示核验源数据

    FacilityAlertCounts:
      type: object
      required: [pending, confirmed, closed, activeWarning, activeSevere, activeEmergency]
      properties:
        pending: { type: integer, minimum: 0 }
        confirmed: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }
        activeWarning: { type: integer, minimum: 0 }
        activeSevere: { type: integer, minimum: 0 }
        activeEmergency: { type: integer, minimum: 0 }
        dataAsOf: { type: [string, 'null'], format: date-time }

    FacilityAlertPage:
      type: object
      required: [items, page, size, total, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FacilityAlert' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        counts: { $ref: '#/components/schemas/FacilityAlertCounts' }

    FacilityFocusItem:
      type: object
      required: [facilityName, healthState, healthStateName, highestAlarmLevel, highestAlarmLevelName, activeAlertCount, pendingCount, confirmedCount, metricNames, oldestTriggerTime, latestCollectTime, focusReason]
      properties:
        facilityName: { type: string }
        healthState: { $ref: '#/components/schemas/FacilityHealthState' }
        healthStateName: { type: string }
        highestAlarmLevel: { $ref: '#/components/schemas/FacilityAlarmLevel' }
        highestAlarmLevelName: { type: string }
        activeAlertCount: { type: integer, minimum: 1 }
        pendingCount: { type: integer, minimum: 0 }
        confirmedCount: { type: integer, minimum: 0 }
        metricNames:
          type: array
          items: { type: string }
        oldestTriggerTime: { type: string, format: date-time }
        latestCollectTime: { type: string, format: date-time }
        focusReason: { type: string }

    FacilityHealthReport:
      type: object
      required: [generatedAt, activeAlertCount, affectedFacilityCount, warningCount, severeCount, emergencyCount, pendingCount, confirmedCount, overallHealth, overallHealthName, summary, facilities]
      properties:
        generatedAt: { type: string, format: date-time }
        dataAsOf: { type: [string, 'null'], format: date-time }
        activeAlertCount: { type: integer, minimum: 0 }
        affectedFacilityCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        severeCount: { type: integer, minimum: 0 }
        emergencyCount: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }
        confirmedCount: { type: integer, minimum: 0 }
        overallHealth: { $ref: '#/components/schemas/FacilityHealthState' }
        overallHealthName: { type: string }
        summary: { type: string }
        facilities:
          type: array
          items: { $ref: '#/components/schemas/FacilityFocusItem' }

    FacilityAlertTransitionRequest:
      type: object
      required: [expectedStatus, targetStatus, remark]
      properties:
        expectedStatus: { $ref: '#/components/schemas/FacilityAlertStatus' }
        targetStatus: { $ref: '#/components/schemas/FacilityAlertStatus' }
        resolutionType:
          type: [string, 'null']
          enum: [RESOLVED, IGNORED, null]
        remark: { type: string, minLength: 1, maxLength: 200 }

    FacilityAlertPageApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/FacilityAlertPage' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    FacilityHealthReportApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/FacilityHealthReport' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    FacilityFocusApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/FacilityFocusItem' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    FacilityAlertApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/FacilityAlert' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    BooleanApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { type: boolean }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    TrafficQueryApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/TrafficQueryResult' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    DispatchApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/DispatchPlan' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    EmergencyAlertApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data:
          oneOf:
            - $ref: '#/components/schemas/EmergencyAlert'
            - type: 'null'
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    SpeechCapabilitiesApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/SpeechCapabilities' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    SpeechTranscriptionApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/SpeechTranscription' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    WorkflowInboxApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/WorkflowInbox' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    EmergencyWorkflowApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/EmergencyWorkflow' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    WorkflowHistoryApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/WorkflowHistory' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        data: { type: 'null' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
