openapi: 3.1.0
info:
  title: 福建应急交通Agent API
  version: 0.5.0
  description: 对话式道路交通查询、数据库异常事件应急调度和Docker语音服务接口
servers:
  - url: http://localhost:8080
paths:
  /api/v1/conversations/{conversationId}/messages/stream:
    post:
      summary: 发送自然语言消息并接收Agent流式事件
      operationId: converseWithAgent
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageRequest'
            example:
              message: 福州五四路现在堵吗
      responses:
        '200':
          description: |
            SSE事件流。事件名称可能为run.started、stage.changed、intent.recognized、
            skill.selected、tool.started、tool.progress、tool.completed、answer.delta、answer.speech、
            result.traffic、run.completed或run.failed。
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                event: answer.delta
                data: {"content":"五四路当前"}
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/speech/capabilities:
    get:
      summary: 查询ASR、TTS当前可用性及上传限制
      description: 语音容器离线时仍返回200，但asrAvailable和ttsAvailable为false。
      operationId: getSpeechCapabilities
      responses:
        '200':
          description: 当前语音能力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechCapabilitiesApiResponse'

  /api/v1/speech/transcriptions:
    post:
      summary: 识别一段浏览器录音
      operationId: transcribeSpeech
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, durationMs]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 最大10 MB，支持WebM、MP4、Ogg或WAV音频
                durationMs:
                  type: integer
                  minimum: 1
                  maximum: 60000
      responses:
        '200':
          description: 识别文本，不会自动发送为聊天消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechTranscriptionApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: ASR容器不可用或识别失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/speech/syntheses:
    post:
      summary: 将一个自然语言片段合成为MP3
      operationId: synthesizeSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechSynthesisRequest'
      responses:
        '200':
          description: Edge-TTS合成的音频；响应禁止缓存
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: TTS容器或Microsoft在线语音服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/emergency-events/pending/next:
    get:
      summary: 查询最早发生的未处理异常事件
      operationId: getNextPendingEmergency
      responses:
        '200':
          description: 返回下一条事件、最新工单版本和待处理总数；无事件时data为null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAlertApiResponse'

  /api/v1/emergency-events/{eventId}/dispatches:
    post:
      summary: 为数据库异常事件生成或重试调度工单
      operationId: generateEmergencyDispatch
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 当前最新工单版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 事件或工单状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 模型服务失败，失败状态已持久化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/emergency-events/{eventId}/no-dispatch:
    post:
      summary: 人工确认事件无需生成调度工单
      operationId: markEmergencyNoDispatch
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoDispatchRequest'
      responses:
        '200':
          description: 事件已标记为无需调度
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 事件已有工单或状态已变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/dispatches/{planId}:
    get:
      summary: 查询调度方案当前状态
      operationId: getDispatchPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 调度方案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/dispatches/{planId}/approvals:
    post:
      summary: 批准或驳回调度方案
      description: 批准会结束事件；驳回必须填写意见并生成下一版本。聊天文字不能审批。
      operationId: approveDispatchPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchApprovalRequest'
            example:
              decision: APPROVE
              comment: 同意执行
              expectedVersion: 1
              idempotencyKey: browser-generated-uuid
      responses:
        '200':
          description: 批准后状态为APPROVED；驳回后返回新生成的WAITING_APPROVAL版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 方案版本冲突或当前状态不允许审批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/traffic/queries:
    post:
      summary: 使用结构化参数查询实时路况（兼容接口）
      operationId: queryRealtimeTraffic
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficQueryRequest'
            example:
              areaCode: '350100'
              roadName: 五四路
              direction: 南向北
      responses:
        '200':
          description: 查询及模型总结完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficQueryApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: 高德或模型服务失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/traffic/area-queries:
    post:
      summary: 使用结构化参数查询行政区交通态势
      description: AREA_ALL查全体命名道路，AREA_MAJOR按高德道路等级4查主要道路。
      operationId: queryAreaTraffic
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaTrafficQueryRequest'
            example:
              city: 厦门
              areaName: 思明区
              scope: AREA_ALL
      responses:
        '200':
          description: 区域路况摘要、Java统计指标、分片覆盖率和全部去重路段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaTrafficApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: 高德或模型服务失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    TraceId:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string
      description: 调用方可传入的链路标识；不传时由后端生成
    PlanId:
      in: path
      name: planId
      required: true
      schema:
        type: string
    EventId:
      in: path
      name: eventId
      required: true
      description: 以字符串传输的w_abnormal_event.id，避免JavaScript整数精度丢失
      schema:
        type: string
        pattern: '^\d+$'

  responses:
    BadRequest:
      description: 请求参数或业务输入不正确
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 事件或调度方案不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AgentMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000

    SpeechCapabilities:
      type: object
      required: [asrAvailable, ttsAvailable, maxRecordingSeconds, maxAudioBytes]
      properties:
        asrAvailable: { type: boolean }
        ttsAvailable: { type: boolean }
        asrModel: { type: [string, 'null'], examples: [small] }
        ttsVoice: { type: [string, 'null'], examples: [zh-CN-XiaoxiaoNeural] }
        maxRecordingSeconds: { type: integer, minimum: 1, examples: [60] }
        maxAudioBytes: { type: integer, minimum: 1, examples: [10485760] }

    SpeechTranscription:
      type: object
      required: [text, language, durationMs]
      properties:
        text: { type: string }
        language: { type: string, examples: [zh] }
        durationMs: { type: integer, minimum: 0 }

    SpeechSynthesisRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    TrafficQueryRequest:
      type: object
      required: [areaCode, roadName]
      properties:
        areaCode:
          type: string
          pattern: '^\d{6}$'
        roadName:
          type: string
          maxLength: 100
        direction:
          type: [string, 'null']
          maxLength: 50

    AreaTrafficQueryRequest:
      type: object
      required: [city, areaName, scope]
      properties:
        city:
          type: string
          maxLength: 30
        areaName:
          type: string
          maxLength: 50
        scope:
          type: string
          enum: [AREA_ALL, AREA_MAJOR]

    TrafficSegment:
      type: object
      required: [roadName, direction, congestionLevel]
      properties:
        roadName:
          type: string
        direction:
          type: string
        congestionLevel:
          type: string
          enum: [UNKNOWN, SMOOTH, SLOW, CONGESTED]
        averageSpeedKmh:
          type: [number, 'null']
        polyline:
          type: [string, 'null']

    TrafficQueryResult:
      type: object
      required: [areaCode, roadName, summary, summarySource, segments, source, acquiredAt, freshness, mock, warnings]
      properties:
        areaCode:
          type: string
        roadName:
          type: string
        direction:
          type: [string, 'null']
        summary:
          type: string
        summarySource:
          type: string
          enum: [MODEL, DETERMINISTIC]
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TrafficSegment'
        source:
          type: string
          examples: [AMAP]
        acquiredAt:
          type: string
          format: date-time
        freshness:
          type: string
          enum: [FRESH, STALE, UNKNOWN]
        mock:
          type: boolean
          const: false
        warnings:
          type: array
          items:
            type: string

    TrafficEvaluation:
      type: object
      required: [totalSegments, smoothSegments, slowSegments, congestedSegments, unknownSegments, smoothRatio, slowRatio, congestedRatio, unknownRatio]
      properties:
        totalSegments: { type: integer, minimum: 0 }
        smoothSegments: { type: integer, minimum: 0 }
        slowSegments: { type: integer, minimum: 0 }
        congestedSegments: { type: integer, minimum: 0 }
        unknownSegments: { type: integer, minimum: 0 }
        smoothRatio: { type: number, minimum: 0, maximum: 1 }
        slowRatio: { type: number, minimum: 0, maximum: 1 }
        congestedRatio: { type: number, minimum: 0, maximum: 1 }
        unknownRatio: { type: number, minimum: 0, maximum: 1 }
        averageSpeedKmh: { type: [number, 'null'] }

    TrafficCoverage:
      type: object
      required: [totalTiles, succeededTiles, failedTiles, coverageRatio, complete]
      properties:
        totalTiles: { type: integer, minimum: 1 }
        succeededTiles: { type: integer, minimum: 0 }
        failedTiles: { type: integer, minimum: 0 }
        coverageRatio: { type: number, minimum: 0, maximum: 1 }
        complete: { type: boolean }

    AreaTrafficResult:
      type: object
      required: [queryScope, areaCode, areaName, city, summary, summarySource, evaluation, coverage, segments, source, acquiredAt, freshness, warnings]
      properties:
        queryScope:
          type: string
          enum: [AREA_ALL, AREA_MAJOR]
        areaCode: { type: string, pattern: '^35\d{4}$' }
        areaName: { type: string }
        city: { type: string }
        summary: { type: string }
        summarySource: { type: string, enum: [MODEL, DETERMINISTIC] }
        evaluation: { $ref: '#/components/schemas/TrafficEvaluation' }
        coverage: { $ref: '#/components/schemas/TrafficCoverage' }
        segments:
          type: array
          items: { $ref: '#/components/schemas/TrafficSegment' }
        source: { type: string, examples: [AMAP] }
        acquiredAt: { type: string, format: date-time }
        freshness: { type: string, enum: [FRESH, STALE, UNKNOWN] }
        warnings:
          type: array
          items: { type: string }

    DispatchApprovalRequest:
      type: object
      required: [decision, expectedVersion, idempotencyKey]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: [string, 'null']
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 1
        idempotencyKey:
          type: string
          minLength: 1

    EmergencyEvent:
      type: object
      required: [eventId, customId, eventType, description]
      properties:
        eventId:
          type: string
          description: 以字符串传输的数据库BIGINT主键
        customId: { type: string }
        occurrenceTime:
          type: [string, 'null']
          format: date-time
        eventType: { type: string }
        description: { type: string }

    SuggestedResource:
      type: object
      required: [resourceType, resourceName, quantity, unit, purpose]
      properties:
        resourceType: { type: string }
        resourceName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        purpose: { type: string }

    NoDispatchRequest:
      type: object
      required: [reason, confirmed]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        confirmed:
          type: boolean
          const: true

    DispatchPlan:
      type: object
      required: [planId, event, suggestedResources, rescuePlan, status, version, createdAt, updatedAt, approvalRequired]
      properties:
        planId: { type: string }
        event: { $ref: '#/components/schemas/EmergencyEvent' }
        suggestedResources:
          type: array
          items: { $ref: '#/components/schemas/SuggestedResource' }
        rescuePlan:
          type: [string, 'null']
        status:
          type: string
          enum: [GENERATING, WAITING_APPROVAL, REJECTED, APPROVED, FAILED]
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rejectionReason: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        approvalRequired: { type: boolean }

    EmergencyAlert:
      type: object
      required: [event, pendingCount]
      properties:
        event: { $ref: '#/components/schemas/EmergencyEvent' }
        dispatch:
          oneOf:
            - $ref: '#/components/schemas/DispatchPlan'
            - type: 'null'
        pendingCount: { type: integer, minimum: 1 }

    TrafficQueryApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/TrafficQueryResult' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    AreaTrafficApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/AreaTrafficResult' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    DispatchApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/DispatchPlan' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    EmergencyAlertApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data:
          oneOf:
            - $ref: '#/components/schemas/EmergencyAlert'
            - type: 'null'
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    SpeechCapabilitiesApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/SpeechCapabilities' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    SpeechTranscriptionApiResponse:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code: { const: OK }
        message: { type: string }
        data: { $ref: '#/components/schemas/SpeechTranscription' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        data: { type: 'null' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
