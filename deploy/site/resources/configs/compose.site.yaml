name: roadagent-fz-pilot
x-common: &common
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: "50m", max-file: "5"}}
services:
  mysql:
    <<: *common
    image: ${MYSQL_IMAGE:?set matching ARM64 MySQL 8.0.45 image}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: road_agent
      MYSQL_USER: roadagent_site
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes: ["${DATA_ROOT}/mysql:/var/lib/mysql"]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -uroot --silent']
      interval: 10s
      retries: 30
  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE:?}
    environment: {POSTGRES_USER: weknora, POSTGRES_PASSWORD: "${DB_PASSWORD:?}", POSTGRES_DB: weknora}
    volumes: ["${DATA_ROOT}/postgres:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U weknora -d weknora"]
      interval: 10s
      retries: 30
  redis:
    <<: *common
    image: ${REDIS_IMAGE:?}
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?}"]
    volumes: [redis-data:/data]
    networks: [private]
  docreader:
    <<: *common
    image: ${WEKNORA_DOCREADER_IMAGE:?}
    environment: {TZ: Asia/Shanghai, DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader, MAX_FILE_SIZE_MB: "50"}
    volumes: ["${DATA_ROOT}/docreader:/tmp/docreader"]
    networks: [private]
  rag-model:
    <<: *common
    image: ${RAG_CPU_IMAGE:?}
    environment: {BGE_API_KEY: "${BGE_API_KEY:?}", HF_HUB_OFFLINE: "1", TRANSFORMERS_OFFLINE: "1"}
    volumes: ["${DATA_ROOT}/models:/models:ro"]
    networks: [private]
  weknora-app:
    <<: *common
    image: ${WEKNORA_APP_IMAGE:?}
    env_file: ["${SITE_ROOT}/weknora.env"]
    environment:
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: weknora
      DB_NAME: weknora
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      DOCREADER_ADDR: docreader:50051
      SSRF_WHITELIST_EXTRA: rag-model,qwen
      DISABLE_REGISTRATION: "true"
      STORAGE_TYPE: local
      TZ: Asia/Shanghai
    volumes: ["${DATA_ROOT}/files:/data/files", "${DATA_ROOT}/docreader:/tmp/docreader:ro", "${SITE_ROOT}/weknora-config.yaml:/app/config/config.yaml:ro"]
    networks: [private]
  weknora-ui:
    <<: *common
    image: ${WEKNORA_UI_IMAGE:?}
    environment: {APP_HOST: weknora-app, APP_PORT: "8080", APP_SCHEME: http}
    ports: ["127.0.0.1:18082:80"]
    networks: [private, ingress]
  speech-service:
    <<: *common
    image: ${SPEECH_CPU_IMAGE:?}
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SPEECH_ASR_MODEL_PATH: /models/Systran--faster-whisper-small
      SPEECH_ASR_DEVICE: cpu
      SPEECH_ASR_COMPUTE_TYPE: int8
      SPEECH_TTS_ENGINE: vllm-omni
      SPEECH_TTS_SERVICE_URL: http://tts:8091
      SPEECH_TTS_SERVICE_MODEL: ${TTS_MODEL_NAME:?}
      SPEECH_TTS_API_KEY: EMPTY
      SPEECH_TTS_VOICE: Serena
      SPEECH_TTS_LANGUAGE: Chinese
      SPEECH_TTS_SAMPLE_RATE: "24000"
      SPEECH_TTS_MAX_CONCURRENCY: "2"
    volumes: ["${DATA_ROOT}/models:/models:ro"]
    networks: [private]
  backend:
    <<: *common
    image: ${BACKEND_IMAGE:?}
    environment:
      ROADAGENT_DB_URL: jdbc:mysql://mysql:3306/road_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      ROADAGENT_DB_USERNAME: roadagent_site
      ROADAGENT_DB_PASSWORD: ${MYSQL_PASSWORD:?}
      ROADAGENT_MODEL_PROVIDER: openai-compatible
      ROADAGENT_MODEL_ENDPOINT: http://qwen:8000/v1/chat/completions
      ROADAGENT_MODEL_NAME: ${LLM_MODEL_NAME:?}
      ROADAGENT_MODEL_AUTH_ENABLED: "false"
      ROADAGENT_MODEL_ENABLE_THINKING: "false"
      ROADAGENT_MODEL_TIMEOUT_SECONDS: "180"
      ROADAGENT_EVENT_CLASSIFICATION_ENABLED: "false"
      ROADAGENT_SPEECH_ENABLED: "true"
      ROADAGENT_SPEECH_SERVICE_URL: http://speech-service:8091
      ROADAGENT_RAG_ENABLED: "true"
      ROADAGENT_RAG_ENDPOINT: http://weknora-app:8080
      ROADAGENT_RAG_API_KEY: ${ROADAGENT_RAG_API_KEY:?restore API key}
      ROADAGENT_RAG_KB_IDS: ${ROADAGENT_RAG_KB_IDS:?}
      ROADAGENT_RAG_TOP_K: "5"
      ROADAGENT_RAG_CONNECT_TIMEOUT_SECONDS: "3"
      ROADAGENT_RAG_REQUEST_TIMEOUT_SECONDS: "30"
    networks: [private]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/api/v1/speech/capabilities]
      interval: 30s
      retries: 20
      start_period: 90s
  frontend:
    <<: *common
    image: ${FRONTEND_IMAGE:?}
    volumes: ["${SITE_ROOT}/package/resources/configs/nginx.site.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:18080:8080"]
    networks: [private, ingress]
networks:
  private: {internal: true}
  ingress: {}
volumes:
  redis-data: {}
