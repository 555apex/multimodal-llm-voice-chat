# =============================================================================
# Road Agent 主配置文件
# 语法说明：${环境变量:默认值} 读环境变量，读不到就用冒号右边的默认值
# =============================================================================

# ------ Spring 框架基础配置 ------
spring:
  application:
    # 应用名称，会在日志和监控中显示
    name: road-agent
  jackson:
    # JSON序列化时，值为null的字段不输出（让返回的JSON更精简）
    default-property-inclusion: non_null
  datasource:
    # 数据库凭据只从运行环境读取，避免将线上密码提交到仓库
    url: ${ROADAGENT_DB_URL}
    username: ${ROADAGENT_DB_USERNAME}
    password: ${ROADAGENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# ------ 内嵌Tomcat服务器配置 ------
server:
  # 服务端口，可通过环境变量 SERVER_PORT 覆盖，默认8080
  port: ${SERVER_PORT:8080}

# =============================================================================
# Road Agent 业务配置（前缀 roadagent）
# =============================================================================
roadagent:

  # ===== 交通数据源配置 =====
  traffic:
    # MySQL为唯一交通数据源。路况和通行能力使用互相独立的快照，已有完整旧批次冷启动立即发布。
    snapshot-poll-seconds: ${ROADAGENT_TRAFFIC_SNAPSHOT_POLL_SECONDS:5}
    snapshot-stable-seconds: ${ROADAGENT_TRAFFIC_SNAPSHOT_STABLE_SECONDS:30}

  # ===== 大模型配置 =====
  model:
    # 当前使用openai-compatible。DeepSeek和多数服务器模型都可采用该协议。
    provider: ${ROADAGENT_MODEL_PROVIDER:openai-compatible}

    # 大模型API地址（仅 provider=openai-compatible 时生效）
    # 默认是DeepSeek的地址，换成通义千问/智谱等兼容OpenAI格式的都可以
    endpoint: ${ROADAGENT_MODEL_ENDPOINT:https://api.deepseek.com/chat/completions}

    # 大模型API密钥，使用模型时必须设置环境变量
    api-key: ${ROADAGENT_MODEL_API_KEY:}

    # 调用的具体模型名称（换成其他厂商时改这里）
    model-name: ${ROADAGENT_MODEL_NAME:deepseek-v4-flash}

    # DeepSeek需要Bearer密钥；无鉴权的内网服务器模型可设为false
    auth-enabled: ${ROADAGENT_MODEL_AUTH_ENABLED:true}

    # 可选：ROADAGENT_MODEL_ENABLE_THINKING 会直接绑定到配置对象。
    # 未设置时请求体保持原样；DGX Qwen 部署显式设为 false，确保结构化JSON稳定。

    # 模型请求超时时间，单位：秒。流式回答比普通API耗时更长
    timeout-seconds: ${ROADAGENT_MODEL_TIMEOUT_SECONDS:60}

  # ===== 会话短期记忆配置 =====
  memory:
    # 每个会话最多保留20条消息，避免上下文无限增长
    max-messages: ${ROADAGENT_MEMORY_MAX_MESSAGES:20}
    # 60分钟没有访问后自动视为新会话
    idle-minutes: ${ROADAGENT_MEMORY_IDLE_MINUTES:60}

  # ===== 数据库应急调度配置 =====
  dispatch:
    # 生成状态超过该时间后允许重试，避免服务中断留下永久卡住的工单
    stale-generating-seconds: ${ROADAGENT_DISPATCH_STALE_GENERATING_SECONDS:120}

  # ===== Docker语音服务配置 =====
  speech:
    # 容器离线不会阻止Java启动；能力接口会返回不可用
    enabled: ${ROADAGENT_SPEECH_ENABLED:true}
    service-url: ${ROADAGENT_SPEECH_SERVICE_URL:http://localhost:8091}
    connect-timeout-seconds: ${ROADAGENT_SPEECH_CONNECT_TIMEOUT_SECONDS:3}
    request-timeout-seconds: ${ROADAGENT_SPEECH_REQUEST_TIMEOUT_SECONDS:90}
    max-recording-seconds: ${ROADAGENT_SPEECH_MAX_RECORDING_SECONDS:60}
    max-audio-bytes: ${ROADAGENT_SPEECH_MAX_AUDIO_BYTES:10485760}
    max-tts-characters: ${ROADAGENT_SPEECH_MAX_TTS_CHARACTERS:500}

# ===== 日志配置 =====
logging:
  level:
    # 全局默认日志级别：INFO（只显示关键信息，不输出调试细节）
    root: INFO
    # 本项目代码的日志级别，调成 DEBUG 可以看详细调用链
    # 可选的级别（按输出量从少到多）：ERROR > WARN > INFO > DEBUG > TRACE
    cn.fj.roadagent: INFO
